startupProbe:
  tcpSocket:
    port: http
  failureThreshold: 30
  periodSeconds: 10
livenessProbe:
  tcpSocket:
    port: http
  periodSeconds: 10
readinessProbe:
  tcpSocket:
    port: http
  periodSeconds: 10
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi
